# baseliner control-repo workflow.
# Place at .github/workflows/baseliner.yml in your control repo.

name: baseliner

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday at 06:00 UTC
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout control repo
        uses: actions/checkout@v4

      - name: Install baseliner
        run: curl -fsSL https://raw.githubusercontent.com/baselinerhq/baseliner/main/scripts/install.sh | bash
        env:
          # Authenticate the latest-release lookup so the install isn't rate-limited
          # on shared runner IPs. (Or pin a version: VERSION: vX.Y.Z)
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run baseliner
        run: |
          "$HOME/.local/bin/baseliner" scan \
            --config baseliner.yaml \
            --output-file results.json \
            --open-issues \
            --format both
        env:
          GITHUB_TOKEN: ${{ secrets.BASELINER_TOKEN }}

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseliner-results
          path: results.json
          if-no-files-found: warn
