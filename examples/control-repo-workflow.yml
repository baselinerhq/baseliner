# baseliner control-repo workflow.
# Place at .github/workflows/baseliner.yml in your control repo.

name: baseliner

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday at 06:00 UTC
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout control repo
        uses: actions/checkout@v4

      # The scan runs with BASELINER_TOKEN, so the binary is pinned here: the
      # archive must match the SHA-256 below and carry build provenance from
      # baseliner's release workflow at VERSION. Bump VERSION and SHA256
      # together, taking the hash from the release's checksums.txt.
      - name: Install baseliner
        env:
          VERSION: v0.4.0
          SHA256: 21c7af860a2f3c531f5185b5ab4906bd444e2c2b089c5e9113b73bba4d3ad737 # baseliner_linux_amd64.tar.gz
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive=baseliner_linux_amd64.tar.gz
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/baselinerhq/baseliner/releases/download/$VERSION/$archive"
          echo "$SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          gh attestation verify "$RUNNER_TEMP/$archive" --repo baselinerhq/baseliner \
            --signer-workflow baselinerhq/baseliner/.github/workflows/release.yml \
            --source-ref "refs/tags/$VERSION" --deny-self-hosted-runners
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" baseliner
          install -D -m 0755 "$RUNNER_TEMP/baseliner" "$HOME/.local/bin/baseliner"

      # Monitor mode: findings go to each repo as a findings issue, so they do
      # not fail this run. A red run means the scan itself broke. See
      # docs/control-repo.md#monitor-mode-what-a-red-run-means.
      #
      # --public-context turns on the privacy guard: this run's log and the
      # results.json artifact are public when the control repo is, so private
      # repos are redacted from them. If this control repo is private, change
      # it to --public-context=false: under Actions, leaving it out still turns
      # the guard on. See docs/control-repo.md#privacy-scanning-private-repos-from-a-public-control-repo.
      - name: Run baseliner
        run: |
          "$HOME/.local/bin/baseliner" scan \
            --config baseliner.yaml \
            --public-context \
            --output-file results.json \
            --open-issues \
            --fail-under 0 \
            --min-coverage 1.0 \
            --format both
        env:
          GITHUB_TOKEN: ${{ secrets.BASELINER_TOKEN }}

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseliner-results
          path: results.json
          if-no-files-found: warn

  # GitHub disables a public repo's scheduled workflows after 60 days without
  # repository activity, and neither these runs nor the findings issues they
  # write count. Re-enabling this (still active) workflow on each run restarts
  # that clock. It is a separate job so the scan keeps a read-only token.
  # See docs/control-repo.md#keeping-the-schedule-alive.
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep the schedule enabled
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/baseliner.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
