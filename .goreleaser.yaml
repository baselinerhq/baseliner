version: 2
project_name: baseliner

before:
  hooks:
    - go mod tidy

builds:
  - id: baseliner
    main: ./cmd/baseliner
    binary: baseliner
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/baselinerhq/baseliner/internal/version.Version={{ .Version }}

archives:
  - id: baseliner
    ids: [baseliner]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

release:
  draft: true

# A Homebrew tap requires a separate `baselinerhq/homebrew-tap` repo. Uncomment
# once it exists (left out here to avoid referencing a non-existent repo):
# brews:
#   - name: baseliner
#     repository:
#       owner: baselinerhq
#       name: homebrew-tap
#     homepage: "https://github.com/baselinerhq/baseliner"
#     description: "Repository fleet baseline compliance engine"
#     license: "MIT"
