name: Feature request
description: Suggest a check, output format, or capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do that baseliner can't do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like baseliner to do? A new check, flag, output format, etc.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've thought about.
  - type: checkboxes
    id: scope
    attributes:
      label: Area
      options:
        - label: A new or changed compliance check
        - label: Output / reporting (console, JSON, issues)
        - label: Discovery or collection (local, GitHub)
        - label: Policy / configuration
        - label: Distribution / CI / tooling
